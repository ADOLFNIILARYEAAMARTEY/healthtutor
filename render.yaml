databases:
  - name: healthtutor-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: healthtutor
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm prisma generate && pnpm build
    startCommand: pnpm prisma migrate deploy && pnpm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthtutor-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NEXTAUTH_URL
        value: "https://healthtutor.onrender.com"
      - key: NODE_VERSION
        value: 22.14.0
